name: Deploy to Cloudflare Pages

on:
  # A preview for each PR.
  pull_request:
    branches: [main]
  # Production, once CI has passed on main. A merge by GITHUB_TOKEN (the merge reservation) sends no
  # push event, so a push trigger missed those merges; the reservation runs CI on main again
  # afterwards (workflow_dispatch), and a person's merge runs it by push, so both reach here.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One production deploy at a time, and one preview per PR, a newer push replacing the older one.
# The groups go by event, so a fork's PR from a branch called main cannot touch production's.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Production follows CI completions, which can come out of order (an older commit's CI may finish
  # last, or be re-run). Deploy only while the commit is still the tip of main; a newer tip is
  # deployed when its own CI finishes. For workflow_run: only a passing CI of this repository's
  # main, started by a push or a dispatch (a fork's PR branch can be called main too, but its
  # run's event is pull_request).
  latest:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: main の先頭か確かめる
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main の先頭は $tip。$SHA は古いので出さない(新しい先頭は、その CI の完了で出る)"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: latest
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.latest.outputs.current == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On workflow_run, the commit CI passed on, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=shirodarts-com --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const deployment_url = '${{ steps.deploy.outputs.deployment-url }}';
            const comment = `## 🚀 Preview Deployment

            ✅ Deployed successfully!

            **Preview URL:** ${deployment_url || 'Building...'}

            ---
            <sub>Commit: ${{ github.sha }}</sub>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
